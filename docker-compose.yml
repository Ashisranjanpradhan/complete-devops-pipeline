services:
  postgres:
    image: postgres:15-alpine
    container_name: opsmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsmind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsmind_user} -d ${POSTGRES_DB:-opsmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsmind-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:postgresql://postgres:5432/opsmind_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-opsmind_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-opsmind_password}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JWT_SECRET=${JWT_SECRET:-8f45a6c3f0b24e6a8e3d64c129f170b92d6e352b9f848f44d18725890eab12f4}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - AI_PROVIDER=${AI_PROVIDER:-builtin}
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsmind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opsmind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - opsmind-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: opsmind-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - opsmind-network

networks:
  opsmind-network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
