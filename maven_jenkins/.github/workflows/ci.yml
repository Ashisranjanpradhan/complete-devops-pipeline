name: OpsMind CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./maven_jenkins/backend
        run: mvn clean verify

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./maven_jenkins/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./maven_jenkins/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./maven_jenkins/frontend
        run: npm run build

  ai-evaluation:
    name: AI Benchmark Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Benchmark Suite
        working-directory: ./maven_jenkins
        run: python3 ai/evaluation/evaluate_ai.py
