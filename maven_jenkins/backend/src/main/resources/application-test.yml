spring:
  datasource:
    url: jdbc:h2:mem:opsmind_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: OpsMindSuperSecretKeyForDevopsIncidentPlatform20261003StrongKeyOpsMindSecured2026
  expiration-ms: 3600000

opsmind:
  ai:
    provider: builtin
